# Station 5 code test build: skips the puzzle, prints the LCD text (including the code) on the UART,
# and releases candy from the dispenser when the code is typed correctly on the keypad.
# Build with: west build -b nrf52840dk/nrf52840 -p always . -- -DEXTRA_CONF_FILE=station_5_code_test.conf
CONFIG_HALLOWEEN_STATION_ID=5
CONFIG_HALLOWEEN_CORRECT_BUTTON=3
CONFIG_I2C=y
CONFIG_HALLOWEEN_TEST_SKIP_PUZZLE=y
CONFIG_HALLOWEEN_CODE_DISPLAY_SECONDS=0
