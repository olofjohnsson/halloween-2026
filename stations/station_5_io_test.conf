# Station 5 I/O test: the LCD shows the last button and key pressed; typing the test code
# (CONFIG_HALLOWEEN_TEST_IO_CODE, '*' clears) starts the DFPlayer Mini. No puzzle, no dispenser.
# Build with: west build -b promicro_nrf52840/nrf52840 -p always . -- -DEXTRA_CONF_FILE=station_5_io_test.conf
CONFIG_HALLOWEEN_STATION_ID=5
CONFIG_HALLOWEEN_CORRECT_BUTTON=3
CONFIG_I2C=y
CONFIG_HALLOWEEN_DFPLAYER=y
CONFIG_HALLOWEEN_TEST_IO=y
CONFIG_HALLOWEEN_TEST_IO_CODE="1237"
CONFIG_HALLOWEEN_TEST_IO_TRACK=1
# Logging is not used for this test (the LCD is the output)
CONFIG_LOG=n
# Keypad scanning off, to check whether it disturbs the LCD (set to n to use the keypad again)
CONFIG_HALLOWEEN_TEST_IO_NO_KEYPAD=n
