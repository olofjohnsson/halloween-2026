# Station 5 test build: requests a candy release every 5 s (no puzzle or keypad needed).
# Build with: west build -b promicro_nrf52840/nrf52840 -p always . -- -DEXTRA_CONF_FILE=station_5_test.conf
# On an nRF52840 DK use -b nrf52840dk/nrf52840 (LED1 blinks on every request).
CONFIG_HALLOWEEN_STATION_ID=5
CONFIG_HALLOWEEN_CORRECT_BUTTON=3
CONFIG_I2C=y
CONFIG_HALLOWEEN_TEST_RELEASE_INTERVAL_S=5
