; Halloween music player: ESP32-C3 Super Mini + DFPlayer Mini.
; Build one player:  pio run -e player1        Flash:  pio run -e player1 -t upload
[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDF_RX_PIN=20
    -DDF_TX_PIN=21
    -DDF_VOLUME=25

[env:player1]
build_flags = ${env.build_flags} -DPLAYER_ID=1

[env:player2]
build_flags = ${env.build_flags} -DPLAYER_ID=2

[env:player3]
build_flags = ${env.build_flags} -DPLAYER_ID=3

; DFPlayer self-test: on boot plays track 1, then track 2 after 5 s.
[env:selftest]
build_flags = ${env.build_flags} -DPLAYER_ID=1 -DDF_SELF_TEST -DDF_SELF_TEST_MS=5000
