name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NCS_VERSION: v3.4.0

jobs:
  build:
    runs-on: ubuntu-latest
    # The toolchain image only sets up PATH in Bash sessions
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: station-1, app: stations, board: promicro_nrf52840/nrf52840, extra: "-DEXTRA_CONF_FILE=station_1.conf" }
          - { name: station-2, app: stations, board: promicro_nrf52840/nrf52840, extra: "-DEXTRA_CONF_FILE=station_2.conf" }
          - { name: station-3, app: stations, board: promicro_nrf52840/nrf52840, extra: "-DEXTRA_CONF_FILE=station_3.conf" }
          - { name: station-4, app: stations, board: promicro_nrf52840/nrf52840, extra: "-DEXTRA_CONF_FILE=station_4.conf" }
          - { name: station-5, app: stations, board: promicro_nrf52840/nrf52840, extra: "-DEXTRA_CONF_FILE=station_5.conf" }
          - { name: candy-dispenser, app: candy-dispenser, board: nrf7002dk/nrf5340/cpuapp, extra: "-DDTC_OVERLAY_FILE=boards/nrf7002dk_nrf5340_cpuapp.overlay" }

    steps:
      - uses: actions/checkout@v4

      - name: Cache nRF Connect SDK
        id: ncs-cache
        uses: actions/cache@v4
        with:
          path: /ncs
          key: ncs-${{ env.NCS_VERSION }}

      - name: Fetch nRF Connect SDK
        if: steps.ncs-cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" /ncs
          cd /ncs
          west update --narrow -o=--depth=1

      - name: Build
        run: |
          git config --global --add safe.directory '*'
          cd /ncs
          west zephyr-export
          west build -b "${{ matrix.board }}" -p always \
            --build-dir "$GITHUB_WORKSPACE/build/${{ matrix.name }}" \
            "$GITHUB_WORKSPACE/${{ matrix.app }}" -- ${{ matrix.extra }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd "build/${{ matrix.name }}"
          # dfu_application.zip is for FOTA; the hex files are for the first SWD flash
          cp dfu_application.zip "$GITHUB_WORKSPACE/out/"
          cp mcuboot/zephyr/zephyr.hex "$GITHUB_WORKSPACE/out/mcuboot.hex"
          cp "${{ matrix.app }}/zephyr/zephyr.signed.hex" "$GITHUB_WORKSPACE/out/app.signed.hex"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error
